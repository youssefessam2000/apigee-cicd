substitutions:
  _ORG: ''
  _ENV: eval
  _API: hello-world
  _HOST: ''
  _BASEPATH: /hello-world

options:
  logging: CLOUD_LOGGING_ONLY

steps:
- id: lint
  name: node:20
  entrypoint: bash
  args:
  - -c
  - npx --yes apigeelint -s apiproxy -f table.js

- id: deploy
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
  - -c
  - |
    set -e
    TOKEN=$(gcloud auth print-access-token)
    python3 -m zipfile -c bundle.zip apiproxy
    REV=$(curl -s -X POST \
      "https://apigee.googleapis.com/v1/organizations/${_ORG}/apis?action=import&name=${_API}" \
      -H "Authorization: Bearer $$TOKEN" \
      -F "file=@bundle.zip" | python3 -c "import sys,json;print(json.load(sys.stdin)['revision'])")
    echo "Imported revision $$REV"
    curl -s -f -X POST \
      "https://apigee.googleapis.com/v1/organizations/${_ORG}/environments/${_ENV}/apis/${_API}/revisions/$$REV/deployments?override=true" \
      -H "Authorization: Bearer $$TOKEN"
    echo "Deploy requested"

- id: smoke-test
  name: gcr.io/google.com/cloudsdktool/cloud-sdk
  entrypoint: bash
  args:
  - -c
  - |
    sleep 60
    curl -f -s https://${_HOST}${_BASEPATH}
